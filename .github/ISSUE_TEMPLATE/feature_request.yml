name: Feature request
description: Something a KanuniLabs component should be able to do and cannot.
labels: ['enhancement', 'needs triage']
body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > This issue will be **public and permanently indexed**. Do not paste a
        > licence key, credentials, or real customer data — and do not describe
        > anything about your product you would not publish yourself.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - DataGrid
        - PivotGrid
        - Both
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        The problem, not the solution. "I need to show a running total per group"
        tells us more than "add a cumulative summary API" — there may already be a
        way, or a better one.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What are you doing today instead?
      description: The workaround, if any, and why it is not good enough.

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Optional. If you have a shape in mind, sketch it.
      render: tsx

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the [docs](https://www.kanunilabs.com/docs) and the [demos](https://www.kanunilabs.com/playground) for an existing way to do this.
          required: true
        - label: I searched existing issues, including closed ones.
          required: true
